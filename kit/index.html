<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카드뉴스 메이커 · 부품 키트</title>
  <link rel="stylesheet" href="../panel/app.css" />
  <link rel="stylesheet" href="../assets/card.css" /> <!-- 표지·사진 틀·책 목업·강사 상반신·2D 아이콘 모양  -->
  <link rel="stylesheet" href="kit.css" />
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .frame > .kcard { transform: scale(.3); transform-origin: 0 0; }
  </style>
</head>
<body>
  <aside class="panel">
    <h1>카드뉴스 메이커 <small style="color:#999;font-weight:400">B. 부품 키트</small></h1>

    <section>
      <h2>내 스타일 <small>(지금 옵션을 저장하고 한 번에 불러오기)</small></h2>
      <div id="myStyles" class="my-styles"></div>
    </section>

    <section>
      <h2>1. 폰트</h2>
      <div class="fonts">
        <label>제목 <select id="fontTitle"></select></label>
        <label>본문 <select id="fontBody"></select></label>
      </div>
    </section>

    <section>
      <h2>2. 컬러</h2>
      <div class="colors">
        <label>메인 <input type="color" data-color="main" /><input class="hex" type="text" maxlength="7" spellcheck="false" aria-label="HEX 코드" /></label>
        <label>배경 <input type="color" data-color="bg" /><input class="hex" type="text" maxlength="7" spellcheck="false" aria-label="HEX 코드" /></label>
        <label>제목 <input type="color" data-color="title" /><input class="hex" type="text" maxlength="7" spellcheck="false" aria-label="HEX 코드" /></label>
        <label>본문 <input type="color" data-color="body" /><input class="hex" type="text" maxlength="7" spellcheck="false" aria-label="HEX 코드" /></label>
      </div>
    </section>

    <section>
      <h2>3. 도형</h2>
      <div class="opt-rows">
        <span>모양</span><div id="shape" class="seg"></div>
        <span>스타일</span><div id="shapeStyle" class="seg"></div>
      </div>
      <div id="shapeShadow" class="panel-line" hidden>
        <label>투명도 <input type="range" min="0" max="30" step="1" data-shadow="opacity" /><code></code></label>
      </div>
      <div id="shapeLine" class="panel-line">
        <label title="테두리 스타일 도형의 테두리 + 구분선·연결선 굵기">테두리 굵기 <input type="range" min="1" max="12" step="1" data-line="width" /><code></code></label>
        <label>테두리 색 <input type="color" data-line="color" /><input class="hex" type="text" maxlength="7" spellcheck="false" aria-label="HEX 코드" /></label>
      </div>
    </section>

    <section>
      <h2>4. 카드 배경</h2>
      <div id="cardStyle" class="seg seg-2x2"></div>
      <div id="panelLine" class="panel-line" hidden>
        <label>테두리 굵기 <input type="range" min="1" max="16" step="1" data-line="width" /><code></code></label>
        <label>테두리 색 <input type="color" data-line="color" /><input class="hex" type="text" maxlength="7" spellcheck="false" aria-label="HEX 코드" /></label>
      </div>
    </section>

    <section>
      <h2>5. 표지</h2>
      <div class="opt-rows">
        <span>배경</span><div id="coverBg" class="seg"></div>
        <span>정렬</span><div id="coverAlign" class="seg"></div>
        <span>이미지</span><div id="coverVisual" class="seg"></div>
      </div>
    </section>

    <input type="file" id="imageFile" accept="image/*" hidden /> <!-- 사진 자리 클릭 시 여는 파일 선택 (보이지 않음) -->

    <button id="export" class="primary">PNG로 내보내기 (ZIP)</button>
  </aside>

  <main class="stage">
    <div class="stage-head"><span id="count"></span></div>
    <div id="deck" class="deck"></div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
